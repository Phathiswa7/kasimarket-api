# Production settings. NO SECRETS in this file: every private value comes from an
# environment variable (written as ${NAME}), set on the server, never in Git.
# Switch it on with the "prod" profile.

# The database. All three values are private.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate adds missing tables and columns. It never deletes data.
# (A bigger project would use a migration tool such as Flyway. That is on our roadmap.)
spring.jpa.hibernate.ddl-auto=update

# Do not print every database query into the logs.
spring.jpa.show-sql=false

# Safety: no database console, no fake accounts, no public API documentation page.
spring.h2.console.enabled=false
kasimarket.dev-data.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# The secret that signs login tokens. It must be long and random.
jwt.secret=${JWT_SECRET}

# The first real admin, created once if no admin exists. Leave both empty afterwards.
bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Where completion photos are saved, and the port to listen on.
storage.photo-dir=${PHOTO_DIR:uploads/job-photos}
server.port=${PORT:8081}
# Vetting: approval needs reviewed documents. The startup guard refuses to run without this.
vetting.required-for-approval=true
storage.vetting-dir=${VETTING_DIR:uploads/vetting-documents}
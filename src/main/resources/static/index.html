<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f5c3a">
  <meta name="color-scheme" content="light dark">
  <title>KasiMarket</title>
  <!-- A tiny built-in icon, so the browser does not ask the server for a favicon file. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f5c3a'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EK%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div id="offline" class="offline" hidden>You are offline. Some things may not work until you are back online.</div>

  <!-- The top bar: the brand, and who is logged in. Filled in by js/app.js -->
  <header id="topbar"></header>

  <!-- The main area: every screen is drawn here. -->
  <main id="view" tabindex="-1" aria-live="polite"></main>

  <!-- The bottom menu (like a phone app). Filled in by js/app.js -->
  <nav id="tabs" aria-label="Main menu" hidden></nav>

  <!-- A small message that pops up for a few seconds. -->
  <div id="toast" role="status"></div>

  <noscript><p class="card">KasiMarket needs JavaScript to run. Please turn it on in your browser.</p></noscript>

  <!-- Order matters: the shared tools first, then the screens, then the router. -->
  <script src="js/core.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/client.js"></script>
  <script src="js/worker.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>


spring.application.name=kasimarket-api
server.port=8081

# In-memory database for development
spring.datasource.url=jdbc:h2:mem:kasimarket
spring.datasource.username=sa
spring.datasource.password=

# Lets us look inside the database from the browser
spring.h2.console.enabled=true

# Hibernate builds the tables from our Java classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Secret key used to sign login tokens (must be at least 32 characters).
# DEVELOPMENT ONLY. Our code is public on GitHub, so this one is not secret.
# Before the real launch we will move it to an environment variable.
jwt.secret=kasimarket-dev-secret-change-me-before-real-use-0123456789

# How long a token stays valid, in milliseconds (86400000 = 24 hours).
jwt.expiration-ms=86400000
# The share of every job price that KasiMarket keeps (0.20 = 20 percent).
# The worker earns the rest. This is an assumption we will test in the pilot.
pricing.commission-rate=0.20
# Where completion photos are saved on this computer (development only).
storage.photo-dir=uploads/job-photos

# The largest photo we accept.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# The trust ladder: when a worker moves up from tier 1 to tier 2.
# They need this many paid jobs AND this average rating (out of 5).
# These are starting values we will tune in the pilot.
tier.tier2-min-jobs=10
tier.tier2-min-rating=4.5
# Tier 3 (babysitting, house watching) must be granted by an admin.
# On top of the admin's approval, the worker needs this many paid jobs
# and this average rating. Starting values to tune in the pilot.
tier.tier3-min-jobs=25
tier.tier3-min-rating=4.7
# A job nobody accepts for this many minutes becomes EXPIRED.
jobs.expiry-minutes=30

# How often the app looks for old open jobs, in milliseconds (60000 = every minute).
jobs.expiry-check-ms=60000
# Workers only see (and can accept) jobs within this many kilometres of them.
jobs.search-radius-km=10
# Arrival time estimate (ETA) shown to the client after a worker accepts.
# Average speed in a town, in km per hour.
eta.average-speed-kmh=25
# Roads are longer than a straight line, so we add 30 percent.
eta.road-factor=1.3
# A worker position older than this many minutes is too old to trust for an ETA.
eta.location-max-age-minutes=5
# Creates the fake test people (admin, client, workers) at startup.
# DEVELOPMENT ONLY. The "prod" profile switches this off, and the app refuses to start
# in production if it is on.
kasimarket.dev-data.enabled=true
# Login protection: after this many wrong passwords within the window,
# that email is locked for the lock time. A correct login resets the count.
login.max-attempts=5
login.window-minutes=15
login.lock-minutes=15
# Where worker documents (ID, police clearance) are saved on this computer. Private, and
# ignored by Git. Development only: on Azure these move to encrypted cloud storage.
storage.vetting-dir=uploads/vetting-documents

# When true, an admin cannot approve a worker until they have an accepted ID document
# and an accepted, still-valid police clearance. False here for quick development tests;
# the prod profile switches it on.
vetting.required-for-approval=false

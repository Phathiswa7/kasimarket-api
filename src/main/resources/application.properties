
spring.application.name=kasimarket-api
server.port=8081

# In-memory database for development
spring.datasource.url=jdbc:h2:mem:kasimarket
spring.datasource.username=sa
spring.datasource.password=

# Lets us look inside the database from the browser
spring.h2.console.enabled=true

# Hibernate builds the tables from our Java classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Secret key used to sign login tokens (must be at least 32 characters).
# DEVELOPMENT ONLY. Our code is public on GitHub, so this one is not secret.
# Before the real launch we will move it to an environment variable.
jwt.secret=kasimarket-dev-secret-change-me-before-real-use-0123456789

# How long a token stays valid, in milliseconds (86400000 = 24 hours).
jwt.expiration-ms=86400000
# The share of every job price that KasiMarket keeps (0.20 = 20 percent).
# The worker earns the rest. This is an assumption we will test in the pilot.
pricing.commission-rate=0.20
# Where completion photos are saved on this computer (development only).
storage.photo-dir=uploads/job-photos

# The largest photo we accept.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# The trust ladder: when a worker moves up from tier 1 to tier 2.
# They need this many paid jobs AND this average rating (out of 5).
# These are starting values we will tune in the pilot.
tier.tier2-min-jobs=10
tier.tier2-min-rating=4.5
# Tier 3 (babysitting, house watching) must be granted by an admin.
# On top of the admin's approval, the worker needs this many paid jobs
# and this average rating. Starting values to tune in the pilot.
tier.tier3-min-jobs=25
tier.tier3-min-rating=4.7
# A job nobody accepts for this many minutes becomes EXPIRED.
jobs.expiry-minutes=30

# How often the app looks for old open jobs, in milliseconds (60000 = every minute).
jobs.expiry-check-ms=60000
